spring:
  application:
    name: shorturl

  datasource:
    url: jdbc:postgresql://postgres:5432/shorturl
    username: shorturl
    password: shorturl

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  shorturl:
    base-url: ${SHORTURL_BASE_URL:http://localhost:8080}