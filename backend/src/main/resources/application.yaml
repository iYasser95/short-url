spring:
  application:
    name: shorturl

  datasource:
    url: jdbc:postgresql://postgres:5432/shorturl
    username: shorturl
    password: shorturl

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

shorturl:
  base-url: ${SHORTURL_BASE_URL:http://localhost:8080}
  cache-limit: ${REDIS_CACHE_LIMIT_BY_HOUR:1}
  expiration-days: ${SHORTURL_EXPIRATION_DAYS:7}

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN}